[build-system]
requires = ["hatchling", "hatch-pinned-extra"]
build-backend = "hatchling.build"

[project]
name = "workspace-app"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dynamic = ["optional-dependencies"]
dependencies = [
    "workspace-lib",
    "typing-extensions>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_app"]

[tool.hatch.metadata.hooks.pinned_extra]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
workspace-lib = { workspace = true }
hatch-pinned-extra = { path = "../../..", editable = true }
