[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-pinned-extra", "hatchling" ]

[project]
name = "workspace-app"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dynamic = [ "optional-dependencies" ]
dependencies = [
  "typing-extensions>=4",
  "workspace-lib",
]

[tool.hatch.metadata.hooks.pinned_extra]
[tool.hatch.build.targets.wheel]
packages = [ "src/workspace_app" ]

[tool.uv.sources]
hatch-pinned-extra = { path = "../../..", editable = true }
workspace-lib = { workspace = true }
[tool.uv.workspace]
members = [ "packages/*" ]
