[build-system]
requires = ["hatchling", "hatch-pinned-extra"]
build-backend = "hatchling.build"

[project]
name = "forked-extras"
version = "0.1.0"
description = ""
requires-python = ">=3.9"
dynamic = ["optional-dependencies"]
dependencies = [
    "lib[feature]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forked_extras"]

[tool.hatch.metadata.hooks.pinned_extra]

[tool.uv.sources]
hatch-pinned-extra = { path = "../../..", editable = true }
