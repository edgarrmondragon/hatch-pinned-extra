[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-pinned-extra",
  "hatchling",
]

[project]
name = "my-api-client"
version = "0.0.0.dev0"
description = "Singer tap for pypistats.org"
requires-python = ">=3.10"
dynamic = [
  "optional-dependencies",
]
dependencies = [
  "requests~=2.33",
  "requests-cache~=1.2",
]

[tool.hatch.metadata.hooks.pinned_extra]
[tool.hatch.build.targets.wheel]
packages = [ "my_apl_client" ]

[tool.uv]
required-version = ">=0.6"
prerelease = "allow"
preview = true
[tool.uv.sources]
hatch-pinned-extra = { path = "../../..", editable = true }
