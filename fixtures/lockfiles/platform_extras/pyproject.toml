[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-pinned-extra", "hatchling" ]

[project]
name = "platform-extras"
version = "0.1.0"
description = ""
requires-python = ">=3.9"
dynamic = [ "optional-dependencies" ]
dependencies = [
  "app",
]

[tool.hatch.metadata.hooks.pinned_extra]
[tool.hatch.build.targets.wheel]
packages = [ "src/platform_extras" ]

[tool.uv.sources]
hatch-pinned-extra = { path = "../../..", editable = true }
