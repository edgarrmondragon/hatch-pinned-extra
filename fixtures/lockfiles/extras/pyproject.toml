[build-system]
requires = [
    "hatchling",
    "hatch_pinned_extra",
]
build-backend = "hatchling.build"

[project]
name = "dep-with-extras"
version = "0.1.0"
description = ""
requires-python = ">=3.9"
dynamic = [
    "optional-dependencies",
]
dependencies = [
    "fastapi[standard]>=0.115.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dep_with_extras"]

[tool.hatch.metadata.hooks.pinned_extra]
name = "pinned"

[tool.uv.sources]
hatch-pinned-extra = { path = "../../..", editable = true }
