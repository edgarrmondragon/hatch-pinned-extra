name: Publish

permissions:
  contents: read

on:
  push:
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Inspect
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.baipp.outputs.package_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@v3.0.2
        id: baipp

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/hatch-pinned-extra/${{ needs.build.outputs.version }}
    permissions:
      id-token: write  # Allow the workflow to publish to PyPI with trusted publishing
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
