[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs",
  "hatchling",
]

[project]
name = "hatch-pinned-extra"
description = "Add a packaging extra with pinned dependencies from a lock file"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Hatch",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.16",
  "Topic :: Software Development :: Build Tools",
]
dynamic = [ "version" ]
dependencies = [
  "hatchling @ git+https://github.com/pypa/hatch.git@refs/pull/2463/head#subdirectory=backend",
  "packaging>=26.1",                                                                            # 26.0+ required for pylock support, 26.1+ required for & and | support for Marker
  "tomli>=1.2.2; python_version<'3.11'",
]
[[project.authors]]
name = "Edgar Ramírez Mondragón"
email = "edgarrm358@gmail.com"
[project.urls]
Changelog = "https://github.com/edgarrmondragon/hatch-pinned-extra/releases"
Source = "https://github.com/edgarrmondragon/hatch-pinned-extra"
[project.entry-points]
hatch.pinned_extra = "hatch_pinned_extra._plugin"

[dependency-groups]
dev = [
  { include-group = "testing" },
  { include-group = "typing" },
]
testing = [
  "coverage>=7",
  "inline-snapshot>=0.36.1",
  "pyproject-hooks>=1.3",
  "pytest>=9",
  "syrupy>=4",
]
typing = [
  { include-group = "testing" },
  "mypy>=1.19.1",
  "tomli",
  "ty>=0.0.15",
]

[tool.hatch]
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
required-version = ">=0.17"
line-length = 100
preview = true
[tool.ruff.lint]
select = [
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C90",  # mccabe
  "CPY",  # flake8-copyright
  "E",    # pycodestyle (error)
  "EM",   # flake8-errmsg
  "F",    # Pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FLY",  # flynt
  "FURB", # refurb
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "PERF", # Perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "TC",   # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle (warning)
  "YTT",  # flake8-2020
]
per-file-ignores."fixtures/*" = [
  "no-self-use",
]
per-file-ignores."tests/*" = [
  "assert",
  "import-private-name",
  "magic-value-comparison",
]

[tool.typos]
[tool.typos.default.extend-words]
certifi = "certifi"  # https://pypi.org/project/certifi/
[tool.typos.files]
extend-exclude = [ "fixtures/**/pylock.*.toml" ]

[tool.mypy]
follow_untyped_imports = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
strict = true

[tool.ty]
[tool.ty.src]
exclude = [
  "noxfile.py",
]

[tool.pytest]
addopts = [ "-ra" ]
filterwarnings = [ "error" ]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [ "tests" ]

[tool.coverage]
[tool.coverage.run]
source = [ "hatch_pinned_extra", "tests" ]
branch = true
relative_files = true  # This allows coverage to be measured in Windows
disable_warnings = [ "no-sysmon" ]
core = "sysmon"
[tool.coverage.report]
show_missing = true
